name: "iOS CI + CD (Calling Repo)"

on:
  push:
    tags:
      - '*build*'

permissions:
  contents: write
  pull-requests: write

jobs:

  extract-version:
    name: Extract App Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, for the build-number guard below

      - name: Extract MARKETING_VERSION from Xcode project
        id: version
        run: |
          set -euo pipefail

          # Assumes MARKETING_VERSION = 1.0 (or similar) in project.pbxproj.
          raw_version=$(grep -m1 'MARKETING_VERSION' PillCounter/PillCounter.xcodeproj/project.pbxproj \
            | sed -E 's/.*MARKETING_VERSION = ([^;]+);.*/\1/' | tr -d ' ')

          # release.yml requires strict x.y.z semver; MARKETING_VERSION is
          # often just "1.0" or "1", so pad any missing components with 0.
          IFS='.' read -r major minor patch <<< "$raw_version"
          version="${major:-0}.${minor:-0}.${patch:-0}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Extracted version: ${version} (from MARKETING_VERSION=${raw_version})"

      # Apple rejects a repeated build number for the same version, and dSYM
      # lookups are cleaner with unique builds.
      - name: Reject a reused build number
        if: contains(github.ref_name, 'release')
        run: |
          set -euo pipefail
          PBX=PillCounter/PillCounter.xcodeproj/project.pbxproj
          field() { { grep -m1 "$2 = " <<<"$1" || true; } | sed -E "s/.*$2 = ([^;]+);.*/\1/" | tr -d ' '; }

          src=$(cat "$PBX")
          cur="$(field "$src" MARKETING_VERSION)-$(field "$src" CURRENT_PROJECT_VERSION)"
          echo "Build id: $cur"

          for tag in $(git tag --list '*release*'); do
            [ "$tag" = "$GITHUB_REF_NAME" ] && continue
            old=$(git show "$tag:$PBX" 2>/dev/null) || continue
            if [ "$(field "$old" MARKETING_VERSION)-$(field "$old" CURRENT_PROJECT_VERSION)" = "$cur" ]; then
              echo "::error::Build id $cur was already released in tag $tag. Bump CURRENT_PROJECT_VERSION."
              exit 1
            fi
          done

  # CI for PRs and branch pushes
  ci:
    uses: Rite-Technologies-23/ops-rite-ios-pipeline/.github/workflows/push.yml@main
    needs: extract-version
    with:
      # ---- core ----
      xcode_version: "latest-stable"
      # The project has a LOCAL Swift package reference to Hl7Core
      # (relativePath ../../swiftpackage) because Hl7Core's Package.swift
      # lives at hl7Core/swiftpackage inside its repo, not at the repo root --
      # SPM remote-package resolution can't target a subdirectory. checkout_hl7core
      # below has the pipeline fetch that folder fresh for each job and stage
      # it as a sibling directory (then delete it again once the job's
      # xcodebuild steps finish) -- nothing is vendored into this repo or
      # committed anywhere. Scheme is kept pinned explicitly (not
      # auto-detected) since the repo also has a LOAD_TEST scheme and
      # auto-detection isn't guaranteed to pick PillCounter first.
      scheme: "PillCounter"
      workspace: ""    # auto-detected (PillCounter.xcworkspace)
      project: ""      # auto-detected (PillCounter.xcodeproj)
      checkout_hl7core: true
      configuration: "Release"
      coverage_threshold: "30.00"
      build_archive: true

      run_tests: true
      run_coverage: true
      run_static_analysis: true

      # ---- formatting ----
      run_formatting: true

      # ---- dead code ----
      run_dead_code: true
      run_clang_analyzer: true

      # ---- security ----
      run_security: true
      run_dependency_audit: true

      # ---- static typing strictness ----
      swift_warnings_as_errors: false
      swift_strict_concurrency: "targeted"

      # ---- gates ----
      # Warn-only while first adopting these tools on this codebase; flip on
      # once the initial backlog of findings is triaged.
      fail_on_lint: false
      fail_on_formatting: false
      fail_on_security: false
      fail_on_vulnerabilities: false
      fail_on_dead_code: false
      fail_on_clang_analyzer: false
    secrets:
      PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}

  # CD for version tags. `ci` above already builds configuration: "Release"
  # with build_archive: true on every push, so `cd` just downloads, signs and
  # ships that same archive -- ops-rite-ios-pipeline's release.yml runs no
  # CI/build of its own (see that pipeline's README "Consolidated CI+CD
  # build" section).
  cd:
    uses: Rite-Technologies-23/ops-rite-ios-pipeline/.github/workflows/release.yml@main
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, 'release')
    needs: [ extract-version, ci ]
    with:
      version: ${{ needs.extract-version.outputs.version }}

      deploy_to_testflight: false
      ios_bundle_id: "com.ritetechnologies.PillCounting"

      enable_whats_new: false
      whats_new_file: ""

      xcode_version: "latest-stable"
      scheme: "PillCounter"  # see the `ci` job above for why this is pinned
      workspace: ""    # auto-detected
      project: ""      # auto-detected
      configuration: "Release"
      coverage_threshold: "30.00"
    secrets:
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}

  # Uploads the dSYMs from the exact archive `cd` shipped (a rebuild would get
  # new binary UUIDs). Never runs for a failed build.
  upload-dsyms:
    name: Upload dSYMs to Datadog
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, 'release')
    needs: [ci, cd]
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Download archive
        uses: actions/download-artifact@v4
        with:
          name: ios-archive-unsigned
          path: archive

      - name: Upload dSYMs
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DATADOG_SITE: datadoghq.com
        run: |
          set -euo pipefail
          if [ -z "$DATADOG_API_KEY" ]; then
            echo "::warning::DATADOG_API_KEY is not set; skipping dSYM upload."
            exit 0
          fi
          npx --yes @datadog/datadog-ci@5.24.1 dsyms upload archive/ios-archive-unsigned.xcarchive/dSYMs
